name: Deploy Backend to GCP Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
      confirm_prod:
        description: 'Type DEPLOY-PROD to confirm production release (ignored for dev)'
        required: false
        type: string
        default: ''

jobs:
  validate:
    name: Validate Guardrails & Branch Safety
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Branch Safety
        run: |
          ENV="${{ github.event.inputs.environment }}"
          REF="${{ github.ref }}"
          echo "Target Environment: $ENV"
          echo "Current Branch / Ref: $REF"
          
          if [ "$ENV" = "prod" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Production deployments are strictly restricted to the 'main' branch! Current ref is $REF."
              exit 1
            fi
            if [ "${{ github.event.inputs.confirm_prod }}" != "DEPLOY-PROD" ]; then
              echo "::error::Production deployment confirmation failed. Please type 'DEPLOY-PROD' in confirm_prod."
              exit 1
            fi
            echo "✅ Production guardrails verified."
          else
            echo "✅ Development environment approved."
          fi

  deploy:
    name: Build & Deploy to Cloud Run
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure Target Environment
        id: config
        run: |
          TARGET_ENV=$(echo "${{ github.event.inputs.environment }}" | tr -d '\r')
          if [ "$TARGET_ENV" = "prod" ]; then
            printf "PROJECT_ID=vaidya-hms-prod\n" >> $GITHUB_ENV
            printf "DB_INSTANCE=vaidya-hms-prod:asia-south1:hms-db-prod\n" >> $GITHUB_ENV
            printf "BUCKET_NAME=vaidya-hms-prod-uploads\n" >> $GITHUB_ENV
            printf "MIN_INSTANCES=1\n" >> $GITHUB_ENV
            printf "MAX_INSTANCES=10\n" >> $GITHUB_ENV
            printf "MEMORY=1Gi\n" >> $GITHUB_ENV
          else
            printf "PROJECT_ID=vaidya-hms-dev\n" >> $GITHUB_ENV
            printf "DB_INSTANCE=vaidya-hms-dev:asia-south1:hms-db-dev\n" >> $GITHUB_ENV
            printf "BUCKET_NAME=vaidya-hms-dev-uploads\n" >> $GITHUB_ENV
            printf "MIN_INSTANCES=0\n" >> $GITHUB_ENV
            printf "MAX_INSTANCES=3\n" >> $GITHUB_ENV
            printf "MEMORY=512Mi\n" >> $GITHUB_ENV
          fi
          printf "REGION=asia-south1\n" >> $GITHUB_ENV
          printf "SERVICE_NAME=hms-backend\n" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/hms-repo/${{ env.SERVICE_NAME }}"
          docker build \
            -t ${IMAGE_BASE}:${GIT_SHA} \
            -t ${IMAGE_BASE}:latest \
            .
          docker push ${IMAGE_BASE}:${GIT_SHA}
          docker push ${IMAGE_BASE}:latest
          echo "IMAGE_DEPLOY=${IMAGE_BASE}:${GIT_SHA}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_DEPLOY }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --cpu 1 \
            --memory ${{ env.MEMORY }} \
            --min-instances ${{ env.MIN_INSTANCES }} \
            --max-instances ${{ env.MAX_INSTANCES }} \
            --add-cloudsql-instances ${{ env.DB_INSTANCE }} \
            --set-env-vars "ENVIRONMENT=${{ github.event.inputs.environment }},DEBUG=False,UPLOAD_DIR=/app/uploads,DB_POOL_SIZE=5,DB_MAX_OVERFLOW=5" \
            --set-secrets "DATABASE_URL=hms-database-url:latest,JWT_SECRET_KEY=hms-jwt-secret:latest,CORS_ORIGINS=hms-cors-origins:latest,GCS_BUCKET_NAME=hms-gcs-bucket:latest" \
            --timeout 300

      - name: Verify Backend Health
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(status.url)')
          echo "Deployed service URL: $SERVICE_URL"
          echo "Checking health endpoint $SERVICE_URL/api/health..."
          curl -f -m 30 "$SERVICE_URL/api/health" || (echo "Healthcheck probe failed!" && exit 1)
          echo "✅ Backend Cloud Run service is active and healthy!"
